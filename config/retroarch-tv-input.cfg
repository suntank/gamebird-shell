# Applied only while HDMI TV Mode is active. The GamePi13 is unbound then, so
# do not carry its saved per-player bindings into RetroArch. Udev supports
# USB/Bluetooth gamepads and keyboards together, and autoconfig can choose the
# first connected external gamepad for player one.
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/home/gamebird/.config/retroarch/autoconfig"
# Handheld mode deliberately uses the GamePi13's analog speaker.  HDMI has a
# separate ALSA card, so select it only in TV Mode.
audio_device = "hdmi:CARD=vc4hdmi,DEV=0"
input_player1_joypad_index = "0"
input_device_p1 = "0"
# Fallback indices for standard pads. A mapped controller profile generated by
# GameBird Shell replaces these with that controller's actual bindings.
input_enable_hotkey_btn = "6"
input_exit_emulator_btn = "7"
