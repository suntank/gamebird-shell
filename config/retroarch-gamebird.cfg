audio_driver = "alsa"
audio_device = "hw:0,0"
# RetroArch's persistent config is user-editable.  Always select the Pi's
# KMS/OpenGL video path for GameBird launches so a stale/null driver cannot
# produce a black screen.
video_driver = "gl"
# GamePi13 is a GPIO controller exposed as /dev/input/js0.  Use the console
# input backend so RetroArch consumes the same joystick button indices that
# GameBird Shell records in retroarch-input-gamebird.cfg.
input_driver = "linuxraw"
input_joypad_driver = "linuxraw"
# Hold Start and press Up/Down for GameBird's volume monitor. RetroArch keeps
# the proven Select+Start exit chord. These fallback GamePi13 indices are
# replaced by the generated runtime profile for other controllers.
input_enable_hotkey_btn = "6"
input_exit_emulator_btn = "7"
network_cmd_enable = "true"
network_cmd_port = "55355"
video_font_enable = "true"
input_overlay = "/tmp/gamebird-battery-overlay.cfg"
input_overlay_enable = "true"
input_overlay_hide_when_gamepad_connected = "false"
# gbhud switches a two-page runtime overlay between hidden and visible. The
# visible page contains one fixed image selected from the launch-time battery
# sample, so input can never cycle through percentage artwork.
input_overlay_show_inputs = "0"
input_overlay_opacity = "1.000000"
input_overlay_auto_scale = "false"
video_fullscreen = "true"
# Let KMS select the active connector's native mode: 240x240 handheld or the
# television's mode when HDMI TV Mode is active.
video_fullscreen_x = "0"
video_fullscreen_y = "0"
video_threaded = "true"
menu_driver = "rgui"
menu_scale_factor = "2.000000"
menu_rgui_full_width_layout = "true"
rgui_internal_upscale_level = "2"
menu_show_online_updater = "true"
menu_show_core_updater = "true"
core_updater_buildbot_url = "http://buildbot.libretro.com"
core_updater_buildbot_assets_url = "http://buildbot.libretro.com/assets/"
core_updater_buildbot_cores_url = "http://buildbot.libretro.com/nightly/linux/armv7-neon-hf/latest/"
core_updater_show_experimental_cores = "true"
libretro_directory = "~/.config/retroarch/cores/"
libretro_info_path = "~/.config/retroarch/info/"
