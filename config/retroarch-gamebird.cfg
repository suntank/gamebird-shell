audio_driver = "alsa"
audio_device = "hw:0,0"
video_fullscreen = "true"
video_fullscreen_x = "240"
video_fullscreen_y = "240"
video_threaded = "true"
menu_driver = "rgui"
menu_scale_factor = "2.000000"
menu_rgui_full_width_layout = "true"
rgui_internal_upscale_level = "2"
menu_show_online_updater = "true"
menu_show_core_updater = "true"
core_updater_buildbot_url = "http://buildbot.libretro.com"
core_updater_buildbot_assets_url = "http://buildbot.libretro.com/assets/"
core_updater_buildbot_cores_url = "http://buildbot.libretro.com/nightly/linux/armv7-neon-hf/latest/"
core_updater_show_experimental_cores = "true"
libretro_directory = "~/.config/retroarch/cores/"
libretro_info_path = "~/.config/retroarch/info/"
