# GameBird N64 profile: Pi Zero 2 W (32-bit ARM, OpenGL ES)
core_options_path = "/home/gamebird/gamebird-shell/config/retroarch-mupen64plus-options.cfg"
# RetroArch otherwise creates config/Mupen64Plus/Mupen64Plus.opt and
# silently gives it precedence over the GameBird performance profile.
global_core_options = "true"
game_specific_options = "false"
video_threaded = "true"
# Reduce resampler work and leave enough buffered audio for occasional N64
# compilation spikes without affecting the global profile used by SNES.
audio_resampler_quality = "0"
audio_latency = "96"
