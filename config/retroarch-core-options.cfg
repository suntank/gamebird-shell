# Mupen64Plus-Next performance profile for the Pi Zero 2 W. The VideoCore IV
# GPU is the limiting factor in GLideN64, so prefer native resolution and avoid
# effects that synchronously copy emulated N64 buffers back through the CPU.
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-rsp-plugin = "hle"
mupen64plus-43screensize = "320x240"
mupen64plus-ThreadedRenderer = "True"
mupen64plus-HybridFilter = "False"
mupen64plus-EnableLODEmulation = "False"
mupen64plus-EnableFBEmulation = "False"
mupen64plus-EnableCopyAuxToRDRAM = "False"
mupen64plus-EnableCopyColorToRDRAM = "Off"
mupen64plus-EnableCopyColorFromRDRAM = "False"
mupen64plus-EnableCopyDepthToRDRAM = "Off"
mupen64plus-BackgroundMode = "OnePiece"
mupen64plus-EnableHWLighting = "False"
mupen64plus-EnableInaccurateTextureCoordinates = "True"
mupen64plus-EnableNativeResTexrects = "Disabled"
mupen64plus-EnableLegacyBlending = "True"
mupen64plus-EnableFragmentDepthWrite = "False"
mupen64plus-EnableTextureCache = "False"
mupen64plus-FrameDuping = "True"
# Apply these choices after the compatibility INI so it cannot turn expensive
# framebuffer paths back on for individual titles.
mupen64plus-GLideN64IniBehaviour = "early"
