# PCSX-ReARMed performance defaults for GameBird's Pi Zero 2 W.
# The core itself was built with its ARM32 ari64 dynarec and NEON GPU.
pcsx_rearmed_bios = "auto"
pcsx_rearmed_region = "auto"
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_drc_thread = "auto"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_gpu_thread_rendering = "enabled"
pcsx_rearmed_dithering = "disabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_neon_enhancement_no_main = "disabled"
pcsx_rearmed_show_bios_bootlogo = "disabled"
pcsx_rearmed_memcard2 = "none"
