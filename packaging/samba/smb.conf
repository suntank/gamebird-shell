[global]
   workgroup = WORKGROUP
   server string = GameBird file share
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = gamebird
   min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   logging = systemd

[GameBird]
   comment = GameBird persistent storage (ROMs, apps, config, and data)
   path = /data/gamebird-shell
   browseable = yes
   read only = no
   guest ok = yes
   guest only = yes
   force user = gamebird
   force group = gamebird
   create mask = 0664
   force create mode = 0660
   directory mask = 0775
   force directory mode = 0770
   inherit permissions = yes
   veto files = /lost+found/
